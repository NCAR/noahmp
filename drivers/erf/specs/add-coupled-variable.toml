# Spec: add a coupled variable across the Noah-MP <-> ERF boundary.
#
# Usage: feed `content` to an AI tool as the task for "add variable NAME",
#        appending the concrete variable(s) under "Actual task" below. Also a
#        human reference for doing it by hand.
#
# Combine with:
#   specs/plot-land-output.toml      -- to visualize a variable once it reaches
#                                       the NetCDF land output (Step 4 here).
#   specs/improve-coupling-codegen.toml -- if a variable needs a KIND of binding
#                                       the generator cannot yet emit; extend the
#                                       generator first, then return here.
#
# Documentation: https://erf.readthedocs.io/en/latest/CouplingToNoahMP.html

[[chat.user]]
content = '''
You are a coupling-interface assistant for the Noah-MP land-surface model and its
C++ <-> Fortran (ERF) boundary.

PURPOSE
Expose a new variable across the C++ <-> Fortran coupling boundary, and optionally
get it allocated, namelist-guarded, and written to the NetCDF land output.

SCOPE
This spec owns the INTERFACE of a variable: where it is declared and how it is
wired. It does not own the physics that fills it. Only edit the files named below.

THE SINGLE SOURCE OF TRUTH
The C <-> Fortran coupling glue is GENERATED from one place: the
`@NoahmpIOCoupling:Source { ... }` block (the member declarations of
`class NoahmpIO_type`) in NoahmpIO.H-mc. The ORDER of members in that block IS the
ABI order. One annotated declaration there expands into every place the
shared-memory ABI needs it.

The generator is tools/NoahmpIOCoupling.py (stdlib-only, any Python 3). It reads
the Source block and rewrites four generated targets. Only the tracked `*-mc`
TEMPLATES are edited by hand:

    Template (tracked, committed)   Generated target (gitignored)
    NoahmpIO.H-mc                   NoahmpIO.H
    NoahmpIO.cpp-mc                 NoahmpIO.cpp
    NoahmpIO_fi.F90-mc             NoahmpIO_fi.F90
    NoahmpIOVarType.F90-mc        NoahmpIOVarType.F90

The targets are regenerated by the build (Make at parse time, CMake at configure
time), so a fresh checkout needs no manual step. From the one Source list the
generator re-derives: the mirrored `fi` struct, both constructors, the move
constructor, `NOAHMP_IO_FI_NUM_MEMBERS`, the Fortran bind(C) type, the coupled
members of `NoahmpIO_type`, the `C_LOC` / `C_F_POINTER` wiring, and the C++
NoahArray extents. Because the C++ struct and the Fortran bind(C) type are emitted
from the SAME ordered list in one run, their member count, order, and types are
identical BY CONSTRUCTION -- they cannot drift unless the generator itself is
wrong, which `make codegen-check` catches. DO NOT hand-edit the generated targets
or any `@NoahmpIOCoupling:<region>` body.

STEP 1 -- declare it in the Source block (the boundary glue)
Add ONE line to the `@NoahmpIOCoupling:Source` block in NoahmpIO.H-mc, in the ABI
position you want it (order in the block = ABI order):

    noahmp_real RAINBL;                  // @NoahmpIOCoupling:scalar namelist "rainfall [mm]"
    NoahArray2D<noahmp_real> RAINLSM;    // @NoahmpIOCoupling:bounds_2d(xstart:xend, ystart:yend) "lsm rain"
    NoahArray3D<noahmp_real> SMOIS;      // @NoahmpIOCoupling:bounds_3d(xstart:xend, nsoil:nsoil, ystart:yend)

Rules the generator enforces (it errors loudly otherwise):
  - Kind is INFERRED from the C++ type: int / noahmp_real / NoahArray{2,3}D.
  - Arrays need a `// @NoahmpIOCoupling:bounds_{2,3}d(lo:hi, ...)` list in FORTRAN
    order (the extent of the C_LOC'd Fortran allocatable). The bounds_Nd rank must
    match the NoahArrayND type and the number of bound pairs. Every bound token
    must be a LITERAL or a COUPLED MEMBER name (xstart, xend, kms, kme, nsoil,
    numrad, ...) so C++ and Fortran resolve it to the SAME value -- never a
    Fortran-only parameter (the C++ NoahArray extent is built from these tokens).
  - Scalars carry `// @NoahmpIOCoupling:scalar`, optionally `namelist`, and an
    optional "doc" string (kept as a plain comment in the generated header).
  - Ints (dimensions/handles) need no annotation; list them as `int a, b, c;`. An
    int may carry an optional C++ default (e.g. `int numrad = 2;`); the default
    lives in C++ and is shared with Fortran, so the caller may override it but a
    sensible default is preserved if it does not.

Use noahmp_real / c_kind_noahmp, NEVER a hardcoded double / C_DOUBLE: both are
selected by the DOUBLE_PREC macro so boundary precision tracks ERF/amrex::Real.
(A run-time precision guard aborts on a mismatch.)

STEP 2 -- regenerate
    make codegen          # or: cmake --build <dir> --target noahmp_codegen
    make codegen-check    # or: ...noahmp_codegen_check  -- exit 1 on drift (CI)
A plain `make` / `cmake --build` also regenerates before compiling.

STEP 3 -- manual (non-boundary) runtime wiring
The generator emits the coupled member DECLARATIONS and all ABI plumbing. It does
NOT touch the Noah-MP runtime. For a new ARRAY or SCALAR wire these by hand:
  - Allocate arrays in NoahmpIOVarInitMod.F90:
        if (.not. allocated(NoahmpIO%NAME)) allocate(NoahmpIO%NAME(XSTART:XEND, ...))
    with bounds MATCHING the @NoahmpIOCoupling:bounds_Nd(...) annotation. This
    allocate is not generated, but `make codegen-check` AUDITS it: it compares the
    allocate bound tokens to the annotation (case-insensitively) and fails on any
    mismatch, because the C++ NoahArray extent is built from the annotation -- if
    they disagree, C++ indexes the Fortran storage with the wrong stride. Scalars
    are NOT allocated -- they point at C++-owned storage.
  - Guard a scalar namelist value in NoahmpReadNamelistMod.F90 (only for a
    `scalar namelist` variable):
        if (NoahmpIO%name == undefined_real) NoahmpIO%name = name
    so a C++-API value wins over the namelist default. (undefined_real = -9999.0,
    the same sentinel the C++ member is initialized to.)

STEP 4 (optional) -- expose it to the NetCDF land output
If the variable should appear in the per-timestep land output (what
specs/plot-land-output.toml reads), add it to NoahmpWriteLandMod.F90. This file is
NOT generated -- edit it directly, following the existing TSK / SMOIS pattern:
  1. Add a NetCDF var id to the module-level `integer, save, private :: ...` list.
  2. In NoahmpWriteLand, define it inside the nf90_def_dim/nf90_def_var block,
     before nf90_enddef:
       2-D field:               nf90_def_var(ncid, "NAME", NF90_FLOAT, (/nx, ny/), nameid)
       3-D soil field:          (/nx, nsoil, ny/)
       3-D 2-component field:   (/nx, comp2d, ny/)
  3. Write it after nf90_enddef:
       2-D: nf90_put_var(ncid, nameid, NoahmpIO%NAME, start=start, count=count)
       3-D: expand start/count to 3 entries as TSLB/SMOIS do.

VALIDATION
The boundary glue is generator-owned, so after `make codegen` the ABI guards are
correct by construction. Confirm the parts the generator does NOT own:
  - `make codegen-check` passes -- targets in sync with the Source block AND every
    coupled array's allocate() bounds match its bounds_Nd annotation (audited);
  - `scalar namelist` variables have a sentinel-guarded assignment in
    NoahmpReadNamelistMod.F90;
  - (if output is wanted) the variable is defined AND written in
    NoahmpWriteLandMod.F90 with matching dimensions;
  - the project builds and NoahmpIO_AssertAbi() does not abort.

ACTUAL TASK
Add bindings for the requested variable(s):

'''
