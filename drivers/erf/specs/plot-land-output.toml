# Spec: plot the Noah-MP NetCDF land output.
#
# Usage: feed `content` to an AI tool as the task for "plot variable NAME" or
#        "make a tool that plots the land output", appending specifics under
#        "Actual task". Also a human reference for the on-disk format.
#
# Combine with:
#   specs/add-coupled-variable.toml  -- its Step 4 adds a new field to the NetCDF
#                                       output; run that first if the variable you
#                                       want to plot is not in the file yet.
#
# Documentation: https://erf.readthedocs.io/en/latest/CouplingToNoahMP.html

[[chat.user]]
content = '''
You are a scientific-Python tooling assistant for the Noah-MP land-surface model.

PURPOSE
Build or improve a Python tool that visualizes the per-timestep land output
written by NoahmpWriteLandMod.F90.

SCOPE
This spec owns the CONSUMER side of the land output: reading the NetCDF files and
rendering them. It does not own what gets written -- that is NoahmpWriteLandMod.F90
(see specs/add-coupled-variable.toml, Step 4, to add a field to the output).

ON-DISK LAYOUT
NoahmpWriteLand writes one directory per output step, one NetCDF-4 file per
refinement level:

    lnd<NNNNN>/Level_<L>.nc     # NNNNN = zero-padded filenum (step); L = level (1 digit)

Files are written collectively over MPI (parallel NetCDF-4). A reader just opens
them normally -- xarray.open_dataset or netCDF4.Dataset.

Dimensions:
    NX      global grid points in x (xsglobal)
    NY      global grid points in y (ysglobal)
    NSOIL   soil layers (NSOIL)
    COMP2D  2 spectral/albedo components

Variable shapes -- written from Fortran, so the FASTEST-VARYING axis is FIRST. A
reader sees the axes in this order:
    2-D surface fields    (NX, NY):
        TERRAIN, SNOWH, SHBXY, EVBXY, VEGFRA, GVFMIN, GVFMAX, TSK, EMISS, SAVXY,
        SAGXY, PAHXY, FIRAXY, HFX, LH, GRDFLX, GHBXY, CANHSXY, TAU_EW, TAU_NS
    3-D soil fields       (NX, NSOIL, NY):  TSLB, SMOIS
    3-D 2-component fields (NX, COMP2D, NY): ALBSFCDIRXY, ALBSFCDIFXY

This list is exactly what NoahmpWriteLandMod.F90 currently defines. Treat the
file's own variable list as authoritative -- DISCOVER variables/dims at run time
rather than hardcoding this table, so the tool keeps working when a field is added.
All output is NF90_FLOAT. There are currently no coordinate variables for NX/NY
(indices only); for lat/lon plotting, derive coordinates from XLAT or a grid file,
or plot in index space.

WHAT THE TOOL SHOULD DO
Build a small Python CLI (suggested tools/plot_land.py) that:
  1. Takes a path to a Level_<L>.nc file (or a lnd<NNNNN> dir, or a glob across
     steps) and a variable name.
  2. Discovers the variable's rank from the file and handles each shape:
       - 2-D: a single (NX, NY) heatmap (pcolormesh/imshow), transposed so the
         image reads as x-horizontal / y-vertical.
       - 3-D: take a --layer (soil index for (NX, NSOIL, NY)) or --component (for
         (NX, COMP2D, NY)) and reduce to a 2-D slice before plotting.
  3. Adds a colorbar, a title (variable @ step / level / layer), labeled axes.
  4. Saves to a file (--out) and/or shows interactively.
  5. Optionally animates or tiles across steps when given a multi-step glob.

CONVENTIONS
  - Prefer xarray + matplotlib; fall back to netCDF4 if xarray is absent. Keep
    dependencies light and document them at the top of the script.
  - Fail clearly when a requested variable is missing -- list the variables
    actually present in the file.
  - Do not assume axis order beyond the table above; read variable.dimensions and
    locate NSOIL/COMP2D BY NAME so the tool survives a writer change.
  - Mask or report sentinel/undefined values (e.g. -9999) rather than letting them
    flatten the color scale.

VALIDATION
  - Opens a real lnd<NNNNN>/Level_<L>.nc and lists its variables;
  - renders a 2-D field and a 3-D field (with layer/component selection);
  - axis orientation matches the (NX, NY) convention (x horizontal);
  - clear error on a missing variable or bad layer/component index.

ACTUAL TASK
Build/extend the plotting tool as requested:

'''
