# Usage: code-scribe update NoahmpIO.H NoahmpIO.cpp NoahpmIO_fi.F90 \
#                           -p specs/noahmpioscalar_update.toml \
#                           -q "Write a natural language prompt with variable name etc." \
#                           -m <openai|argo|..>
#
# Documentation: https://erf.readthedocs.io/en/latest/CouplingToNoahMP.html

[[chat.user]]
content = '''
You are a code-update assistant for Fortran–C interoperability interfaces used
in the Noah-MP land-surface model.

Only edit the appended files. You must preserve consistent variable ordering between
the C++ struct (`NoahmpIO_type_fi`) and the Fortran bind(C) type (`NoahmpIO_type_fi`)
to prevent segmentation faults.

This prompt is for SCALAR variables (single `double` values), which use a different
binding mechanism than array variables. For array variables (wrapped in `NoahArray2D`
or `NoahArray3D`), use `specs/noahmpio_update.toml` instead.

Maintain the same naming conventions and pointer mapping logic as existing scalar
entries such as `DTBL` and `ZLVL`.

1. Context

-  Scalar variables are declared in **NoahmpIOVarType.F90** as `pointer` scalars
   of kind `c_kind_noahmp` (NOT `allocatable` arrays). They are not allocated in
   **NoahmpIOVarInitMod.F90**; instead they point directly at storage owned by the
   C++ side.

-  Each scalar has:
   - a `noahmp_real*` pointer in the C++ `struct NoahmpIO_type_fi`,
   - a plain `noahmp_real` member in the `class NoahmpIO_type` (the actual storage),
   - a `type(C_PTR)` field in the Fortran bind(C) type, and
   - a `real(kind=c_kind_noahmp), pointer` scalar in the Fortran `NoahmpIO_type`.

   (`noahmp_real` / `c_kind_noahmp` are C_DOUBLE/C_FLOAT depending on the
   DOUBLE_PREC macro, so the coupling boundary tracks ERF/amrex::Real.)

-  Unlike arrays, scalars are bound in **NoahmpIOScalarInitDefault_fi** using
   `C_F_POINTER` (the C++ side owns the memory and the Fortran pointer is aimed at
   it), e.g.:

   ```
   call C_F_POINTER(NoahmpIO_cptr%DTBL, NoahmpIO_vect(level)%NoahmpIO(bid)%DTBL)
   call C_F_POINTER(NoahmpIO_cptr%ZLVL, NoahmpIO_vect(level)%NoahmpIO(bid)%zlvl)
   ```

   Scalars are NOT wrapped with `NoahArray` and have NO entry in
   `NoahmpIO_type::VarInitDefault()` or in `NoahmpIOVarInitDefault_fi`.

2. Task Details

Update the following files to include and correctly link the new scalar variable
`ZLVL` between the C++ and Fortran layers.

File: NoahmpIO.H

-  Add a pointer member `noahmp_real* ZLVL = nullptr;` in `struct NoahmpIO_type_fi`
   immediately after the existing scalar pointer `DTBL`. Add a short trailing
   comment with the physical meaning and units.

-  Add a plain scalar member `noahmp_real ZLVL = -9999.0;` to `class NoahmpIO_type`
   immediately after `noahmp_real DTBL;`. Initialize it to a sentinel so it can fall
   back to a namelist value when not set via the C++ API.

-  Add `noahmp_real* ZLVL` to the `NoahmpIO_type_fi(...)` constructor parameter list
   (after `noahmp_real* DTBL`), and add `ZLVL(ZLVL)` to its member initializer list
   (after `DTBL(DTBL)`).

-  Add `&ZLVL` to the `fptr(...)` initializer in the `NoahmpIO_type()` constructor
   (after `&DTBL`).

-  Increment `NOAHMP_IO_FI_NUM_MEMBERS` by one. This compile-time constant must
   equal the number of members in `NoahmpIO_type_fi`; the static_assert and the
   run-time ABI guards rely on it.

-  Update the `NoahmpIO_type` MOVE constructor (`NoahmpIO_type(NoahmpIO_type&& o)`),
   which is self-referential and must be kept in sync by hand:
     - add `ZLVL(o.ZLVL),` to the member initializer list (after `DTBL(o.DTBL)`), and
     - add `fptr.ZLVL=&ZLVL;` in the constructor body (after `fptr.DTBL=&DTBL;`),
       re-pointing the new scalar handle at THIS object's member.
   Omitting either half leaves the moved object's fptr pointing at freed memory.

File: NoahmpIO.cpp

-  No change. Scalars are bound on the Fortran side in `NoahmpIOScalarInitDefault_fi`
   and do NOT get a `NoahArray` wrapper in `NoahmpIO_type::VarInitDefault()`.

File: NoahmpIO_fi.F90

-  Add `type(C_PTR) :: ZLVL` to type `NoahmpIO_type_fi`, immediately after the
   `DTBL` field, matching the order in the C++ struct.

-  Within subroutine `NoahmpIOScalarInitDefault_fi` (NOT `NoahmpIOVarInitDefault_fi`),
   after the `C_F_POINTER` call for `DTBL`, add:

   ```
   call C_F_POINTER(NoahmpIO_cptr%ZLVL, NoahmpIO_vect(level)%NoahmpIO(bid)%zlvl)
   ```

-  Add a positional entry for the new field to function `NoahmpIOCheckMemberOrder_fi`,
   in the canonical order block, immediately after the `DTBL`/`ZLVL` entries:

   ```
   call chk(probe%ZLVL, 31)
   ```

   The index is the field's zero-based position in `NoahmpIO_type_fi` (same on both
   sides). Renumber the entries that follow so every index stays equal to its
   position; this handshake is what catches a member reordered on only one side.

File: NoahmpIOVarType.F90

-  Declare the scalar in `NoahmpIO_type` as a `c_kind_noahmp` pointer (NOT an
   allocatable array), default-initialized to `null()` so its association status
   is well-defined before `NoahmpIOScalarInitDefault_fi` wires it:

   ```
   real(kind=c_kind_noahmp), pointer                       ::  zlvl=>null()
   ```

   Note the spaces to align everything at the right locations.

File: NoahmpReadNamelistMod.F90 (only if the scalar also has a namelist value)

-  Do NOT unconditionally overwrite a scalar that the C++ side may have already set.
   Guard the namelist assignment with the sentinel so an API-provided value wins,
   following the `zlvl` pattern:

   ```
   if (NoahmpIO%zlvl == undefined_real) NoahmpIO%zlvl = zlvl
   ```

3. Validation

Check that both `NoahmpIO_type_fi` definitions (C++ and Fortran) have identical
ordering. Ensure variable names exactly match between Fortran and C++ to avoid
memory mapping issues. Confirm the scalar is declared `pointer` (not `allocatable`)
and is bound with `C_F_POINTER` in `NoahmpIOScalarInitDefault_fi`, not with `C_LOC`
in `NoahmpIOVarInitDefault_fi`.

Confirm the four cross-cutting bookkeeping edits are all present, since each backs
a run-time ABI guard and a missing one is silent corruption:
  - `NOAHMP_IO_FI_NUM_MEMBERS` increased by one (must equal the member count);
  - the new field copied AND re-pointed in the `NoahmpIO_type` move constructor;
  - a `call chk(...)` entry added with the correct index in `NoahmpIOCheckMemberOrder_fi`,
    with all following indices still equal to their positions;
  - the Fortran pointer declared with `=> null()`.

Only modify the files that are explicitly requested to modify. That is, if I don't add
contents of the file, do not edit it.

4. Actual Task

Create bindings for the requested scalar variables

'''
